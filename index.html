<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="생활 장부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="supabase.min.js"></script>
<title>생활 장부</title>
<style>
/* Layout: 폰 우선 단일 컬럼 앱 — 회색 바탕 위 흰 카드, 큰 숫자 위계, 반투명 하단 탭 */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --sunk:#f2f4f6; --ink:#191f28; --ink-2:#333d4b; --muted:#8b95a1; --line:#eceff2;
  --accent:#3268f0; --accent-ink:#ffffff; --accent-soft:#e8efff;
  --good:#16a36a; --warn:#e8870e; --bad:#f04452;
  --c-fixed:#b0b8c1; --c-var:#3268f0; --c-inv:#7a5cf0; --c-left:#cfdcff; --c-over:#f04452; --up:#e5293b; --down:#2f6bf0;
  --tab-bg:rgba(255,255,255,.86); --ins-bg:#eaf0ff; --ins-ink:#1b2a4e;
  --font-body:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","SF Pro Text","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --font-num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --r:20px; --shadow:0 1px 2px rgba(0,27,55,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101013; --surface:#1b1b20; --sunk:#26262d; --ink:#f2f3f5; --ink-2:#c9ced6; --muted:#8a919c; --line:#2a2a31;
  --accent:#5b8cff; --accent-ink:#0b1430; --accent-soft:#1c2540;
  --good:#34c38a; --warn:#f5a23b; --bad:#ff6b76;
  --c-fixed:#5a616b; --c-var:#5b8cff; --c-inv:#9b84ff; --c-left:#2a3a66; --c-over:#ff6b76; --up:#ff6b76; --down:#6b9bff;
  --tab-bg:rgba(27,27,32,.86); --shadow:none; --ins-bg:#1d2540; --ins-ink:#e6ecff;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101013; --surface:#1b1b20; --sunk:#26262d; --ink:#f2f3f5; --ink-2:#c9ced6; --muted:#8a919c; --line:#2a2a31;
  --accent:#5b8cff; --accent-ink:#0b1430; --accent-soft:#1c2540;
  --good:#34c38a; --warn:#f5a23b; --bad:#ff6b76;
  --c-fixed:#5a616b; --c-var:#5b8cff; --c-inv:#9b84ff; --c-left:#2a3a66; --c-over:#ff6b76; --up:#ff6b76; --down:#6b9bff;
  --tab-bg:rgba(27,27,32,.86); --shadow:none; --ins-bg:#1d2540; --ins-ink:#e6ecff;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-size:20px;font-weight:700;letter-spacing:-.03em}
.monthnav{display:flex;align-items:center;gap:0;background:var(--surface);border-radius:999px;padding:2px;box-shadow:var(--shadow)}
.monthnav button{background:none;border:0;width:34px;height:34px;border-radius:999px;font-size:17px;color:var(--muted)}
.monthnav button:hover{background:var(--sunk);color:var(--ink)}
.monthnav .m{min-width:88px;text-align:center;font-weight:600;font-size:14.5px}
.banner{background:var(--accent-soft);color:var(--ink-2);border-radius:14px;padding:12px 14px;font-size:13.5px}
.banner[data-tone="warn"]{background:color-mix(in srgb,var(--warn) 14%,var(--surface))}

/* sections */
.card{background:var(--surface);border:0;border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.card h2{margin:0;font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 .muted,.card h2 .small{font-weight:500}
.card h2 .link{background:var(--sunk);border:0;color:var(--ink-2);font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;margin-left:auto}
.card h2 .link:hover{color:var(--accent)}
.hero{display:flex;flex-direction:column;gap:4px}
.hero .label{font-size:14px;color:var(--muted);font-weight:500}
.hero .big{font-size:32px;font-weight:700;line-height:1.2;letter-spacing:-.035em}
.hero .sub{font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 12%,var(--surface));color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 13%,var(--surface));color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 11%,var(--surface));color:var(--bad)}

.flowbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--sunk);gap:2px}
.flowbar span{display:block;height:100%;border-radius:2px}
.legend{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px}
.legend .k{display:flex;align-items:center;gap:8px;color:var(--muted)}
.legend .k i{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend .v{text-align:right;font-weight:600;color:var(--ink-2)}
.legend .total{border-top:1px solid var(--line);padding-top:6px;font-weight:600;color:var(--ink)}

.meter{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:999px}
.meter.warn span{background:var(--warn)} .meter.bad span{background:var(--bad)}
.row-between{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:13px}

.bars{display:flex;flex-direction:column;gap:11px}
.bar{display:grid;grid-template-columns:84px 1fr auto;align-items:center;gap:12px;font-size:13.5px}
.bar .track{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar .track span{display:block;height:100%;background:var(--c-var);border-radius:999px}
.bar .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.bar .num{font-weight:600;color:var(--ink-2)}

/* lists */
.list{display:flex;flex-direction:column;margin:0 -8px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 8px;border:0;border-radius:12px;background:none;text-align:left;width:100%;align-items:center}
.item:hover{background:var(--sunk)}
.item .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.item .m{font-size:12.5px;color:var(--muted);grid-column:1}
.item .a{grid-row:1/3;grid-column:2;text-align:right;font-weight:600}
.item .a small{display:block;font-size:12px;color:var(--muted);font-family:var(--font-body);font-weight:500}
.dayhead{font-size:12.5px;font-weight:600;color:var(--muted);padding:14px 8px 4px;display:flex;justify-content:space-between}
.empty{color:var(--muted);font-size:14px;padding:4px 0;display:flex;flex-direction:column;gap:10px;line-height:1.55}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:0;background:var(--sunk);color:var(--ink-2);border-radius:12px;padding:11px 16px;font-weight:600;font-size:14.5px}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--sunk)}
.btn.danger{color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.chip{border:0;background:var(--sunk);color:var(--ink-2);border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}

/* todos */
.todo{display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;align-items:start;padding:11px 0}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--c-fixed);background:var(--surface);display:grid;place-items:center;padding:0;margin-top:1px;font-size:12px}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.todo .body{background:none;border:0;text-align:left;padding:0;min-width:0}
.todo .body .t{font-weight:600;overflow-wrap:anywhere}
.todo.done .body .t{text-decoration:line-through;color:var(--muted)}
.todo .body .m{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.prio{width:6px;height:6px;border-radius:50%;display:inline-block;margin-top:9px}
.prio.high{background:var(--bad)} .prio.mid{background:var(--warn)} .prio.low{background:var(--c-fixed)}

/* invest */
.invgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.invgrid div{display:flex;flex-direction:column;gap:3px;min-width:0}
.invgrid .l{font-size:12.5px;color:var(--muted)}
.invgrid .v{font-size:17px;font-weight:700;overflow-wrap:anywhere;letter-spacing:-.03em}
.spark{width:100%;height:64px;display:block}
.pos{color:var(--good)} .neg{color:var(--bad)}
.up{color:var(--up)!important} .dn{color:var(--down)!important}
.cmp{display:flex;flex-direction:column;gap:9px;padding-top:12px;border-top:1px solid var(--line)}
.cbar{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;font-size:13px}
.cbar .lab{color:var(--muted)} .cbar .num{font-weight:600;text-align:right;min-width:58px}
.cbar .trk{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden} .cbar .trk i{display:block;height:100%;border-radius:999px}
.trend{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.trow{display:grid;grid-template-columns:64px 1fr auto;gap:10px;font-size:13.5px;align-items:baseline}

/* insight + chart */
.insight{background:var(--ins-bg);color:var(--ins-ink)}
.insight h2{color:var(--ins-ink)}
.insight .ins li{color:color-mix(in srgb,var(--ins-ink) 86%,transparent)}
.insight .ins b{color:var(--ins-ink)}
.insight .dot{background:color-mix(in srgb,var(--ins-ink) 40%,transparent)}
.ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ins li{display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:baseline;font-size:14.5px;line-height:1.5}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line);display:inline-block;transform:translateY(-2px)}
.insight .dot.good,.dot.good{background:var(--good)} .insight .dot.warn,.dot.warn{background:var(--warn)} .insight .dot.bad,.dot.bad{background:var(--bad)}
.chart{width:100%;height:auto;display:block;max-width:100%}
.lg{display:inline-block;width:14px;height:0;vertical-align:middle;margin:0 4px 0 8px}
.lg:first-child{margin-left:0}
.lg.acc{border-top:2.5px solid var(--accent)} .lg.dash{border-top:1.5px dashed var(--muted)} .lg.tick{width:3px;height:8px;background:var(--warn)}
.item.plan{row-gap:8px}

.tappable{cursor:pointer;transition:transform .12s}
.tappable:active{transform:scale(.99)}
.tappable:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.more{color:var(--accent);font-weight:600;white-space:nowrap}

.arow{display:flex;align-items:center;gap:10px;padding:10px 8px}
.arow .info{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.arow .info .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .info .m{font-size:12.5px;color:var(--muted)}
.arow .amt{font-weight:600;white-space:nowrap}

/* calendar */
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;gap:2px;box-shadow:var(--shadow)}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.cal{gap:10px;padding:16px 14px}
.cal .wk,.cal .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wk span{text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.cal .wk .sun,.cd.sun .dn{color:var(--bad)} .cal .wk .sat,.cd.sat .dn{color:var(--accent)}
.cd{position:relative;border:0;border-radius:12px;padding:6px 2px 8px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:color-mix(in srgb,var(--accent) calc(var(--heat,0) * 22%),var(--surface));min-width:0}
.cd.empty-cell{background:none}
.cd .dn{font-size:13px;font-weight:600;color:var(--ink-2)}
.cd .dv{font-size:10.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;letter-spacing:-.04em}
.cd.today .dn{background:var(--accent);color:#fff;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center}
.cd.sel{outline:2px solid var(--ink);outline-offset:-2px}
.cd .marks{display:flex;gap:3px;position:absolute;bottom:4px}
.mk{display:inline-block;width:5px;height:5px;border-radius:50%;vertical-align:middle}
.mk.inc{background:var(--good)} .mk.plan{background:var(--warn)}

/* tab bar + fab */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--tab-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{background:none;border:0;border-radius:10px;padding:7px 2px;font-size:11.5px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
.fab{position:fixed;z-index:7;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(80px + env(safe-area-inset-bottom,0px));
  background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-weight:700;font-size:15px;
  box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 35%,transparent);display:flex;gap:6px;align-items:center}
@media (min-width:640px){.fab{right:calc(50% - 280px)}}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;max-height:90vh;overflow:auto;
  padding:22px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:16px}
.sheet h3{margin:0;font-size:21px;font-weight:700;letter-spacing:-.03em}
.field{display:flex;flex-direction:column;gap:7px}
.field>label,.field>.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);border:1.5px solid transparent;border-radius:12px;padding:12px 14px}
.field input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.field input.amt{font-family:var(--font-num);font-size:26px;font-weight:700;letter-spacing:-.03em;padding:12px 14px}
.field .hint{font-size:12.5px;color:var(--muted)}
.sheet .actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.sheet .actions .r{display:flex;gap:8px;margin-left:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(144px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
.sheet{overscroll-behavior:contain;will-change:transform}
.grab{flex:none;align-self:center;width:40px;height:5px;border-radius:3px;background:var(--line);margin:-12px 0 -6px;position:relative}
.grab::before{content:"";position:absolute;inset:-14px -40px}
@media (prefers-reduced-motion:no-preference){
  .scrim{animation:fadein .24s ease}
  .sheet{animation:up .32s cubic-bezier(.22,1,.36,1)}
  @keyframes up{from{transform:translateY(100%)}}
  @keyframes fadein{from{background:rgba(0,0,0,0)}}
  .scrim.closing{transition:background .24s ease;background:rgba(0,0,0,0)}
  .scrim.closing .sheet{transition:transform .26s cubic-bezier(.4,0,.6,1);transform:translateY(100%)!important}
}
.netbox summary{list-style:none;cursor:pointer}.netbox summary::-webkit-details-marker{display:none}.netbox[open] summary .small{visibility:hidden}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#login[hidden]{display:none}
#login form{width:100%;max-width:360px;background:var(--surface);border-radius:24px;padding:28px 22px;display:flex;flex-direction:column;gap:14px}
#login h1{margin:0 0 4px;font-size:24px;letter-spacing:-.03em}
#login input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);border:1.5px solid transparent;border-radius:12px;padding:13px 14px}
#login input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
#login button{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:14px;padding:14px;background:var(--accent);color:#fff}
#login .err{color:var(--up);font-size:13.5px;min-height:1em}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">생활 장부</div>
    <div class="monthnav">
      <button id="prevM" aria-label="이전 달">‹</button>
      <div class="m" id="monthLabel">—</div>
      <button id="nextM" aria-label="다음 달">›</button>
    </div>
  </header>
  <div id="status" class="banner" hidden></div>
  <main id="view" class="wrap"></main>
</div>

<button class="fab" id="fab"><span aria-hidden="true">＋</span><span id="fabLabel">지출 기록</span></button>

<nav class="tabs" aria-label="메뉴"><div class="in">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg>요약</button>
  <button data-tab="spend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>지출</button>
  <button data-tab="fixed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M9 4v5M15 4v5"/></svg>수입·고정</button>
  <button data-tab="invest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19h16"/><path d="M5 15l4-4 3 3 6-7"/><path d="M15 7h3v3"/></svg>투자</button>
  <button data-tab="todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>할 일</button>
</div></nav>

<div id="sheetHost"></div>
<div id="toastHost"></div>

<div id="login" hidden><form id="loginForm" autocomplete="on">
  <h1>생활 장부</h1><div class="muted small">처음 한 번만 로그인하면 계속 유지돼요.</div>
  <input id="lgEmail" type="email" autocomplete="username" placeholder="이메일" value="kmoris0122@gmail.com" required>
  <input id="lgPw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
  <div class="err" id="lgErr"></div>
  <button type="submit">로그인</button>
</form></div>
<script>
(() => {
"use strict";
// ---------- 상수 ----------
const VAR_CATS = ["식비","카페·간식","교통","약속·모임","쇼핑","생활용품","의료·건강","자기계발","경조사","기타"];
const FIXED_CATS = ["주거","통신","보험","구독","교통","대출","용돈·가족","기타"];
const INV_TYPES = ["주식/ETF","퇴직연금·연금","보험","예적금·청약","현금·포인트","기타"];
const TODO_CATS = ["진료","행정","재정","개인","약속"];
const PRIOS = [["high","높음"],["mid","보통"],["low","낮음"]];
const FIXED_SUGGEST = [["통신비","통신"],["보험료","보험"],["구독 서비스","구독"],["관리비/월세","주거"],["교통비","교통"]];

// ---------- 상태 ----------
const S = {
  tab: "home", month: ym(new Date()), todoView: "open", spendView: "cal", selDay: null,
  income: [], fixed: [], expenses: [], invest: [], todos: [], snaps: [], debts: [], plans: [], dc: [], recent: [], settings: {},
  loaded: false, db: null, canWrite: true, unsubExp: null,
};
try { const t = localStorage.getItem("ledger.tab"); if (t) S.tab = t; const sv=localStorage.getItem("ledger.spendView"); if(sv) S.spendView=sv; } catch (e) {}

// ---------- 유틸 ----------
function ym(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function ymd(d){ return ym(d)+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ return ymd(new Date()); }
function shiftMonth(m, k){ const [y,mo]=m.split("-").map(Number); return ym(new Date(y, mo-1+k, 1)); }
function daysInMonth(m){ const [y,mo]=m.split("-").map(Number); return new Date(y, mo, 0).getDate(); }
function won(n){ return Math.round(n||0).toLocaleString("ko-KR")+"원"; }
function man(n){ const v=(n||0)/10000; return (Math.abs(v)>=100? Math.round(v).toLocaleString("ko-KR") : (Math.round(v*10)/10).toLocaleString("ko-KR"))+"만"; }
function amt(str){ const n=Number(String(str||"").replace(/[^0-9]/g,"")); return Number.isFinite(n)?n:0; }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function sum(a, f){ return a.reduce((t,x)=>t+(Number(f(x))||0),0); }
function mLabel(m){ const [y,mo]=m.split("-"); return `${y}년 ${Number(mo)}월`; }
function dLabel(s){ if(!s) return ""; const d=new Date(s+"T00:00:00"); const w="일월화수목금토"[d.getDay()]; return `${d.getMonth()+1}/${d.getDate()} (${w})`; }
function diffDays(s){ const a=new Date(today()+"T00:00:00"), b=new Date(s+"T00:00:00"); return Math.round((b-a)/86400000); }
function toast(msg){ const h=document.getElementById("toastHost"); h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>h.innerHTML="",2200); }
function docs(snap){ return snap.docs.map(d=>({id:d.id, ...d.data()})); }
// 결제수단: 예전 '[인센]' 메모 기록도 인센으로 인식
function methodOf(e){ return e.method || (/^\s*\[인센\]/.test(e.memo||"")? "인센" : "신한"); }
// 부채 추정 잔액: 기준일 이후 지난 달 수 × 월 상환액을 빼서 계산
function monthsSince(d){ if(!d) return 0; const [y,m]=d.slice(0,7).split("-").map(Number), n=new Date(); return Math.max(0,(n.getFullYear()*12+n.getMonth()+1)-(y*12+m)); }
function estDebt(d){ return Math.max(0,(Number(d.balance)||0)-(Number(d.monthlyPay)||0)*monthsSince(d.asOf)); }
// 정산 받을 돈을 뺀 내 몫
function own(e){ return Math.max(0,(Number(e.amount)||0)-(Number(e.reimb)||0)); }
function incenLimit(){ const v=S.settings.incenMonthly; return (v===undefined||v===null||v==="")? 1000000 : Number(v)||0; }

// ---------- 계산 ----------
function calc(){
  const m=S.month;
  const inc=S.income.filter(x=>x.month===m);
  const fixedOn=S.fixed.filter(x=>x.active!==false);
  const incomeT=sum(inc,x=>x.amount), fixedT=sum(fixedOn,x=>x.amount), varT=sum(S.expenses,own);
  const invMonthly=sum(S.invest,x=>x.monthly);
  const left=incomeT-fixedT-varT-invMonthly;
  const byCat={}; S.expenses.forEach(e=>byCat[e.category||"기타"]=(byCat[e.category||"기타"]||0)+own(e));
  const principal=sum(S.invest,x=>x.principal), value=sum(S.invest,x=>x.value);
  const incenUsed=sum(S.expenses.filter(e=>methodOf(e)==="인센"),x=>x.amount), shinhanUsed=sum(S.expenses.filter(e=>methodOf(e)!=="인센"),x=>x.amount);
  const pending=S.expenses.filter(e=>Number(e.reimb)>0 && !e.reimbDone), pendingT=sum(pending,x=>x.reimb);
  const incenLim=incenLimit(), incenLeft=incenLim-incenUsed;
  const debtT=sum(S.debts,estDebt);
  return {inc,incomeT,fixedT,varT,invMonthly,left,byCat,principal,value,ret: principal? (value-principal)/principal : 0,incenUsed,shinhanUsed,incenLim,incenLeft,debtT,net:value-debtT,pending,pendingT};
}

// ---------- 일정 반영 예산 계산 ----------
// 계획선 = (변동비 예산 − 일정 예산 합)을 매일 균등 + 각 일정 예산을 해당 날짜(여러 날이면 나눠서)에 더한 누적
function monthPlans(){ return S.plans.filter(p=>p.month===S.month).sort((a,b)=>(a.date||"").localeCompare(b.date||"")); }
function planName(id){ return (S.plans.find(p=>p.id===id)||{}).name||""; }
function dayIn(date, m, dim){ if(!date) return 1; const pm=date.slice(0,7); if(pm<m) return 1; if(pm>m) return dim; return Number(date.slice(8,10))||1; }
function planCalc(c){
  const m=S.month, dim=daysInMonth(m), budget=Number(S.settings.varBudget)||0, curM=ym(new Date());
  const dayNow= m===curM? new Date().getDate() : (m<curM? dim : 0);
  const plans=monthPlans(), planT=sum(plans,p=>p.budget), base=Math.max(budget-planT,0);
  const daily=new Array(dim+1).fill(0), act=new Array(dim+1).fill(0);
  for(let d=1; d<=dim; d++) daily[d]=base/dim;
  plans.forEach(p=>{ const s=dayIn(p.date,m,dim), e=Math.max(s, dayIn(p.endDate||p.date,m,dim)); for(let d=s; d<=e; d++) daily[d]+=(Number(p.budget)||0)/(e-s+1); });
  S.expenses.forEach(e=>{ const d=dayIn(e.date,m,dim); act[d]+=own(e); });
  const plannedCum=[0], actualCum=[0];
  for(let d=1; d<=dim; d++){ plannedCum[d]=plannedCum[d-1]+daily[d]; actualCum[d]=actualCum[d-1]+act[d]; }
  const byPlan={}; S.expenses.forEach(e=>{ if(e.plan) byPlan[e.plan]=(byPlan[e.plan]||0)+own(e); });
  const t=today();
  const upcomingLeft=sum(plans.filter(p=>(p.endDate||p.date)>=t), p=>Math.max((Number(p.budget)||0)-(byPlan[p.id]||0),0));
  const remainDays= m===curM? dim-dayNow+1 : (m>curM? dim : 0);
  const diff= dayNow? actualCum[dayNow]-plannedCum[dayNow] : 0;
  return {m,dim,budget,dayNow,plans,planT,base,plannedCum,actualCum,byPlan,upcomingLeft,remainDays,diff};
}

// ---------- 한 줄 진단 ----------
function insights(c, pc){
  const out=[];
  pc.plans.forEach(p=>{ const a=pc.byPlan[p.id]||0, b=Number(p.budget)||0; if(b && a>b) out.push({tone:"bad", html:`<b>${esc(p.name)}</b> 예산을 <b class="num">${won(a-b)}</b> 넘었어요`}); });
  if(pc.budget && pc.dayNow){
    const th=pc.budget*.05;
    if(pc.diff>th) out.push({tone: pc.diff>pc.budget*.15?"bad":"warn", html:`계획보다 <b class="num">${won(pc.diff)}</b> 빠르게 쓰고 있어요`});
    else if(pc.diff<-th) out.push({tone:"good", html:`계획보다 <b class="num">${won(-pc.diff)}</b> 여유 있게 쓰고 있어요`});
    else if(c.varT>0) out.push({tone:"good", html:`일정을 반영한 계획대로 쓰고 있어요`});
  }
  const cats=Object.entries(c.byCat).sort((a,b)=>b[1]-a[1]);
  if(cats.length && c.varT>0){ const [k,v]=cats[0]; out.push({tone:"", html:`이번 달은 <b>${esc(k)}</b>에 가장 많이 썼어요 · 변동비의 <b class="num">${Math.round(v/c.varT*100)}%</b> (${man(v)})`}); }
  const t=today(), next=pc.plans.find(p=>(p.endDate||p.date)>=t);
  if(next) out.push({tone:"", html:`다음 일정: <b>${esc(next.name)}</b> ${dLabel(next.date)} · 예산 ${man(next.budget)}${pc.byPlan[next.id]?` (지금까지 ${man(pc.byPlan[next.id])})`:""}`});
  if(c.incenLim && c.incenLeft>0 && pc.dayNow && pc.m===ym(new Date())){
    const nonPlan=sum(S.expenses.filter(e=>!e.plan && methodOf(e)==="인센"),x=>x.amount), avg=nonPlan/pc.dayNow;
    const up=pc.upcomingLeft;
    if(avg>0){ const days=Math.floor(Math.max(c.incenLeft-up,0)/avg);
      out.push({tone: pc.dayNow+days>=pc.dim? "good":"warn", html: pc.dayNow+days>=pc.dim
        ? `인센은 남은 일정 예산(${man(up)})까지 써도 월말까지 버틸 수 있어요`
        : c.incenLeft<=up
          ? `남은 일정 예산(${man(up)})이 인센 잔액(${man(c.incenLeft)})보다 커요 · 일정 중 <b class="num">${man(up-c.incenLeft)}</b>은 신한으로 내게 돼요`
          : `남은 일정 예산 ${man(up)}을 빼면, 인센은 평소 속도로 약 <b class="num">${days}일</b> 더 쓸 수 있어요`}); }
  }
  if(c.incomeT && c.varT>0) out.push({tone:"", html:`수입 대비 <b class="num">${Math.round((c.fixedT+c.varT)/c.incomeT*100)}%</b>를 썼어요 (고정비 포함)`});
  return out.slice(0,4);
}
function vInsight(c, pc){
  const list=insights(c, pc);
  if(!list.length) return "";
  return `<section class="card insight">
    <h2>이번 달 한눈에</h2>
    <ul class="ins">${list.map(i=>`<li><i class="dot ${i.tone}"></i><span>${i.html}</span></li>`).join("")}</ul>
  </section>`;
}

// ---------- 예산 진행 그래프 ----------
function vBudget(c, pc){
  if(!pc.budget) return `<section class="card"><h2>변동비 예산 <button class="link" data-act="budget">예산 정하기</button></h2>
    <div class="empty">한 달 변동비 목표를 정하고 일정 예산을 넣으면, 계획 대비 지금 속도를 그래프로 보여드려요.</div></section>`;
  const W=320,H=150,L=4,R=4,T=10,B=18, dim=pc.dim;
  const maxY=Math.max(pc.budget, pc.actualCum[pc.dayNow]||0, pc.plannedCum[dim])*1.08||1;
  const x=d=>L+d*(W-L-R)/dim, y=v=>T+(1-v/maxY)*(H-T-B);
  const path=(arr,n)=>arr.slice(0,n+1).map((v,d)=>`${d?"L":"M"}${x(d).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const used=c.varT/pc.budget;
  const tone= pc.diff>pc.budget*.15? "bad" : pc.diff>pc.budget*.05? "warn" : "good";
  const label= !pc.dayNow? "아직 시작 전" : tone==="good"? (pc.diff<-pc.budget*.05? "계획보다 여유":"계획대로") : tone==="warn"? "계획보다 빠름" : "계획보다 많이 빠름";
  const remain=pc.budget-c.varT, free=remain-pc.upcomingLeft;
  const ticks=pc.plans.map(p=>{ const d=dayIn(p.date,pc.m,dim); return `<line x1="${x(d-.5).toFixed(1)}" x2="${x(d-.5).toFixed(1)}" y1="${H-B}" y2="${H-B+5}" stroke="var(--warn)" stroke-width="2"/>`; }).join("");
  const nowX= pc.dayNow? x(pc.dayNow) : null;
  return `<section class="card">
    <h2>변동비 예산 <button class="link" data-act="budget">예산 수정</button></h2>
    <div class="row-between"><span class="num" style="font-size:20px;font-weight:700;letter-spacing:-.03em">${won(c.varT)}</span><span class="muted small num">/ ${won(pc.budget)} · ${Math.round(used*100)}%</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="계획 대비 누적 변동비">
      <line x1="${L}" x2="${W-R}" y1="${y(pc.budget)}" y2="${y(pc.budget)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${W-R}" y="${y(pc.budget)-3}" text-anchor="end" font-size="9" fill="var(--muted)">예산 ${man(pc.budget)}</text>
      <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)" stroke-width="1"/>
      ${ticks}
      <path d="${path(pc.plannedCum,dim)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
      ${pc.dayNow? `<path d="${path(pc.actualCum,pc.dayNow)} L${x(pc.dayNow)},${H-B} L${x(0)},${H-B}Z" fill="var(--accent-soft)" opacity=".7"/>
      <path d="${path(pc.actualCum,pc.dayNow)}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>
      <circle cx="${nowX}" cy="${y(pc.actualCum[pc.dayNow])}" r="3.5" fill="var(--accent)"/>`:""}
      <text x="${L}" y="${H-4}" font-size="9" fill="var(--muted)">1일</text>
      <text x="${x(Math.ceil(dim/2))}" y="${H-4}" font-size="9" fill="var(--muted)" text-anchor="middle">${Math.ceil(dim/2)}일</text>
      <text x="${W-R}" y="${H-4}" font-size="9" fill="var(--muted)" text-anchor="end">${dim}일</text>
    </svg>
    <div class="row-between small muted"><span><i class="lg acc"></i>실제 누적 <i class="lg dash"></i>일정 반영 계획 <i class="lg tick"></i>일정</span></div>
    <div class="row-between small">
      <span class="pill ${pc.dayNow?tone:""}">${label}${pc.dayNow&&Math.abs(pc.diff)>=1000?` ${pc.diff>0?"+":"−"}${man(Math.abs(pc.diff))}`:""}</span>
      ${pc.remainDays>0 && remain>0? `<span class="muted">남은 일정 ${man(pc.upcomingLeft)} 빼고 하루 <b class="num">${won(Math.max(free,0)/pc.remainDays)}</b></span>`:""}
    </div>
  </section>`;
}

// ---------- 일정별 예산 ----------
function vPlans(pc){
  const t=today();
  return `<section class="card">
    <h2>일정별 예산 <span class="muted small">${man(pc.planT)} / 생활 ${man(pc.base)}</span>${S.canWrite?`<button class="link" data-act="add-plan">＋ 일정</button>`:""}</h2>
    ${pc.plans.length? `<div class="list">${pc.plans.map(p=>{
      const a=pc.byPlan[p.id]||0, b=Number(p.budget)||0, r=b? a/b : 0, end=p.endDate||p.date;
      const st= end<t? (a>b?["bad","초과"]:["good","완료"]) : p.date<=t? ["warn","진행 중"] : ["",`D-${diffDays(p.date)}`];
      return `<button class="item plan" data-plan-detail="${p.id}">
        <span class="t">${esc(p.name)} <span class="pill ${st[0]}" style="padding:1px 7px;font-size:11px">${st[1]}</span></span>
        <span class="a num">${man(a)}<small>/ ${man(b)}</small></span>
        <span class="m">${dLabel(p.date)}${p.endDate&&p.endDate!==p.date?" ~ "+dLabel(p.endDate):""}</span>
        <span class="meter ${r>1?"bad":r>.85?"warn":""}" style="grid-column:1/3;height:6px"><span style="width:${Math.min(r*100,100).toFixed(1)}%"></span></span>
      </button>`;}).join("")}</div>
      <div class="muted small">일정을 누르면 어디에 얼마 썼는지 볼 수 있어요. 지출 기록 때 '일정'을 고르면 여기에 합산돼요.</div>`
    : `<div class="empty">소개팅, 여행처럼 돈이 몰리는 일정을 예산과 함께 넣어두면 계획선에 반영돼요.</div>`}
  </section>`;
}

// ---------- 렌더 ----------
const $view=document.getElementById("view");
function render(){
  document.getElementById("monthLabel").textContent=mLabel(S.month);
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===S.tab?"page":"false"));
  const fab=document.getElementById("fab"), fl=document.getElementById("fabLabel");
  const fabMap={home:"지출 기록",spend:"지출 기록",fixed:"고정비 추가",invest:"투자 추가",todo:"할 일 추가"};
  fl.textContent=fabMap[S.tab]; fab.hidden=!S.canWrite;
  const c=calc();
  $view.innerHTML = ({home:vHome,spend:vSpend,fixed:vFixed,invest:vInvest,todo:vTodo})[S.tab](c);
}

function vHome(c){
  const budget=Number(S.settings.varBudget)||0;
  const dim=daysInMonth(S.month), isCur=S.month===ym(new Date());
  const dayNow=isCur? new Date().getDate() : (S.month<ym(new Date())? dim : 0);
  const remainDays=Math.max(dim-dayNow+(isCur?1:0),0);
  const used=budget? c.varT/budget : 0;
  const tone= !budget? "" : used>1? "bad" : (isCur && used > dayNow/dim + .1)? "warn" : "good";
  const flowTotal=Math.max(c.incomeT, c.fixedT+c.varT+c.invMonthly, 1);
  const seg=(v,col)=> v>0? `<span style="width:${(v/flowTotal*100).toFixed(2)}%;background:var(${col})"></span>`:"";
  const leftTone=c.incomeT===0? "" : c.left<0? "bad" : c.left < c.incomeT*.1? "warn":"good";
  const cats=Object.entries(c.byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat=cats[0]?.[1]||1;
  const openTodos=S.todos.filter(t=>!t.done).sort(todoSort).slice(0,4);
  const pc=planCalc(c);

  return `
  ${vInsight(c, pc)}
  <section class="card">
    <div class="hero">
      <div class="row-between"><span class="label">${Number(S.month.slice(5))}월에 남는 돈</span>
        ${c.incomeT? `<span class="pill ${leftTone}">${c.left<0?"적자":"수입의 "+Math.round(c.left/c.incomeT*100)+"%"}</span>`:""}</div>
      <div class="big num ${c.left<0?"neg":""}">${c.incomeT? won(c.left) : "수입을 먼저 적어주세요"}</div>
      <div class="sub">수입 − 고정비 − 변동비 − 투자 납입</div>
    </div>
    <div class="flowbar" role="img" aria-label="수입 대비 지출 구성">
      ${seg(c.fixedT,"--c-fixed")}${seg(c.varT,"--c-var")}${seg(c.invMonthly,"--c-inv")}${seg(Math.max(c.left,0),"--c-left")}
    </div>
    <div class="legend">
      <span class="k">수입</span><span class="v num">${won(c.incomeT)}</span>
      <span class="k"><i style="background:var(--c-fixed)"></i>고정비</span><span class="v num">${won(c.fixedT)}</span>

function vIncen(c, isCur, remainDays){

  const used=c.incenUsed/c.incenLim, left=c.incenLeft;

  const msg= left<=0? "다 썼어요 · 이제 직접 결제는 신한체크" : tone==="warn"? "거의 다 썼어요" : "사용 가능";

function incDate(i){ if(i.date) return i.date; const m=/^(\d{1,2})\/(\d{1,2})/.exec(i.note||""); return m? `${i.month.slice(0,4)}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}` : ""; }
function selDay(){
  const m=S.month; if(S.selDay && S.selDay.slice(0,7)===m) return S.selDay;
  return m===ym(new Date())? today() : m+"-01";
}
function vCalendar(c){
  const m=S.month, [y,mo]=m.split("-").map(Number), dim=daysInMonth(m), first=new Date(y,mo-1,1).getDay();
  const byDay={}; S.expenses.forEach(e=>{ if((e.date||"").slice(0,7)===m) byDay[e.date]=(byDay[e.date]||0)+own(e); });
  const incDays=new Set(S.income.filter(i=>i.month===m).map(incDate).filter(Boolean));
  const planDays=new Set(); monthPlans().forEach(p=>{ const s=Number(p.date.slice(8)), e=p.endDate&&p.endDate.slice(0,7)===m? Number(p.endDate.slice(8)) : s; for(let d=s; d<=e; d++) planDays.add(`${m}-${String(d).padStart(2,"0")}`); });
  const max=Math.max(1,...Object.values(byDay)), sel=selDay(), td=today();
  const cells=[]; for(let i=0;i<first;i++) cells.push(`<span class="cd empty-cell"></span>`);
  for(let d=1; d<=dim; d++){
    const ds=`${m}-${String(d).padStart(2,"0")}`, v=byDay[ds]||0, dow=(first+d-1)%7;
    const heat= v? Math.max(.12, Math.min(1, v/max)) : 0;
    cells.push(`<button class="cd${ds===sel?" sel":""}${ds===td?" today":""}${dow===0?" sun":dow===6?" sat":""}" data-day="${ds}" aria-label="${mo}월 ${d}일 지출 ${won(v)}" style="--heat:${heat.toFixed(2)}">
      <span class="dn">${d}</span><span class="dv num">${v? short(v):""}</span>
      <span class="marks">${incDays.has(ds)?`<i class="mk inc"></i>`:""}${planDays.has(ds)?`<i class="mk plan"></i>`:""}</span></button>`);
  }
  return `<section class="card cal">
    <div class="wk"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span></div>

  </section>`;
}

function vDay(c){
  const d=selDay(), dayN=Number(d.slice(8));

function invBars(){
  const held=S.invest.filter(x=>Number(x.qty)>0); if(!held.length) return "";
  const hp=sum(held,x=>x.principal), hv=sum(held,x=>x.value), g=hv-hp, mx=Math.max(hp,hv,1), cls=g>0?"up":g<0?"dn":"";
  return `<div class="cmp">
    <div class="row-between"><span class="muted small">투자 평가손익</span><b class="num ${cls}" style="font-size:18px">${g>0?"+":""}${won(g)}</b></div>
    <div class="cbar"><span class="lab">원금</span><span class="trk"><i style="width:${(hp/mx*100).toFixed(1)}%;background:var(--c-fixed)"></i></span><span class="num">${man(hp)}</span></div>
    <div class="cbar"><span class="lab">평가액</span><span class="trk"><i style="width:${(hv/mx*100).toFixed(1)}%;background:var(--${g>=0?"up":"down"})"></i></span><span class="num ${cls}">${man(hv)}</span></div>
  </div>`;
}
function invTrend(snaps){
  if(!snaps.length) return "";
  const rows=snaps.slice(-6).map((s,i,a)=>{ const v=Number(s.value)||0, prev=i? Number(a[i-1].value)||0 : null, d=prev===null? null : v-prev;
    return `<div class="trow"><span class="muted">${s.id.slice(0,4)}.${s.id.slice(5)}</span><span class="num" style="font-weight:600">${man(v)}</span>
      <span class="num ${d>0?"up":d<0?"dn":"muted"}">${d===null? "기준" : `${d>0?"▲":d<0?"▼":"–"} ${man(Math.abs(d))} (${prev? (d/prev*100>0?"+":"")+(d/prev*100).toFixed(1)+"%":"–"})`}</span></div>`; }).join("");
  return `<div class="trend"><div class="muted small" style="font-weight:600">월별 총자산 평가액 <span style="font-weight:400">(현금·예적금 포함 · 지난달 대비)</span></div>${rows}</div>`;
}
function spark(snaps){
  if(snaps.length<2) return `<div class="muted small">평가액을 다음 달에도 갱신하면 월별 추이 그래프가 생겨요.</div>`;
  const W=320,H=64,P=6, vals=snaps.map(s=>Number(s.value)||0), pr=snaps.map(s=>Number(s.principal)||0);
  const all=[...vals,...pr], lo=Math.min(...all), hi=Math.max(...all), rng=hi-lo||1;
  const x=i=>P+i*(W-2*P)/(snaps.length-1), y=v=>H-P-(v-lo)/rng*(H-2*P);
  const line=a=>a.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const last=vals.length-1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="월별 평가액 추이">
    <path d="${line(vals)} L${x(last)},${H} L${x(0)},${H}Z" fill="var(--accent-soft)"/>
    <path d="${line(pr)}" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
    <path d="${line(vals)}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(last)}" cy="${y(vals[last])}" r="3.5" fill="var(--accent)"/></svg>
    <div class="row-between small muted"><span>${snaps[0].id.replace("-",".")}</span><span>실선 평가액 · 점선 원금</span><span>${snaps[last].id.replace("-",".")}</span></div>`;
}

function todoSort(a,b){
  const da=a.due||"9999", dbb=b.due||"9999"; if(da!==dbb) return da.localeCompare(dbb);
  const po={high:0,mid:1,low:2}; return (po[a.prio]??1)-(po[b.prio]??1);
}
function todoRow(t){
  let due="";
  if(t.due){ const d=diffDays(t.due);
    due = d<0&&!t.done? `<span class="pill bad">${-d}일 지남</span>` : d===0? `<span class="pill warn">오늘</span>` : d===1? `<span class="pill">내일</span>` : `<span>${dLabel(t.due)}</span>`; }
  return `<div class="todo ${t.done?"done":""}">
    <button class="check" role="checkbox" aria-checked="${!!t.done}" aria-label="완료 표시" data-toggle="${t.id}" ${S.canWrite?"":"disabled"}>${t.done?"✓":""}</button>
    <button class="body" data-edit="todo" data-id="${t.id}"><div class="t">${esc(t.title)}</div>
      <div class="m">${due}${t.category?`<span>${esc(t.category)}</span>`:""}${t.note?`<span>· ${esc(t.note)}</span>`:""}</div></button>
    <span class="prio ${t.prio||"mid"}" title="중요도"></span></div>`;
}
function vTodo(){
  const open=S.todos.filter(t=>!t.done).sort(todoSort), done=S.todos.filter(t=>t.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  const buckets=[["지난 기한",t=>t.due&&diffDays(t.due)<0],["오늘",t=>t.due&&diffDays(t.due)===0],["7일 안",t=>t.due&&diffDays(t.due)>0&&diffDays(t.due)<=7],["나중에",t=>t.due&&diffDays(t.due)>7],["기한 없음",t=>!t.due]];
  const body = S.todoView==="open"
    ? (open.length? buckets.map(([name,f])=>{const a=open.filter(f); return a.length? `<section class="card"><h2>${name} <span class="muted">${a.length}</span></h2><div class="list">${a.map(todoRow).join("")}</div></section>`:"";}).join("")
       : `<section class="card"><div class="empty">남은 할 일이 없어요. 진료 외 행정, 카드값·세금 확인처럼 잊기 쉬운 일을 적어두세요.</div></section>`)
    : `<section class="card"><h2>완료 <span class="muted">${done.length}</span>${done.length&&S.canWrite?`<button class="link" data-act="clear-done">완료 항목 지우기</button>`:""}</h2>
       ${done.length?`<div class="list">${done.slice(0,50).map(todoRow).join("")}</div>`:`<div class="empty">완료한 일이 여기에 모여요.</div>`}</section>`;
  return `<div class="quick"><button class="chip" aria-pressed="${S.todoView==="open"}" data-todoview="open">진행 중 ${open.length}</button>
    <button class="chip" aria-pressed="${S.todoView==="done"}" data-todoview="done">완료 ${done.length}</button></div>${body}`;
}

function openSheet(kind, id, preset){
  if(!S.canWrite && !id) return;
  const F=FORMS[kind]; const cur= id? listOf[kind]().find(x=>x.id===id) : (kind==="budget"? S.settings : null);
  const v=k=>{
    if(preset && preset[k]!==undefined) return preset[k];
    if(cur && cur[k]!==undefined){
      if(kind==="todo"&&k==="prio") return (PRIOS.find(p=>p[0]===cur.prio)||PRIOS[1])[1];
      if(kind==="fixed"&&k==="active") return cur.active===false?"일시 중지":"사용 중";
    }
    if(cur && kind==="expense" && k==="reimbState") return cur.reimbDone?"받음":"받기 전";
    if(cur && cur[k]!==undefined){
      return cur[k];
    }
    if(k==="date") return S.month===ym(new Date())? today() : S.month+"-01";
    if(kind==="expense" && k==="method") return (cur? methodOf(cur) : (calc().incenLeft>0? "인센" : "신한"));
    return F.fields.find(f=>f.k===k).def ?? "";

// ---------- 자주 쓰는 분류·가게 (최근 3개월 기록 기준) ----------
function memoKey(m){ return String(m||"").split("(")[0].replace(/\s+/g,"").replace(/^\[인센\]/,"").trim(); }
function catOrder(){
  const n={}; S.recent.forEach(e=>{ const c=e.category||"기타"; n[c]=(n[c]||0)+1; });
  return [...VAR_CATS].sort((a,b)=>(n[b]||0)-(n[a]||0) || VAR_CATS.indexOf(a)-VAR_CATS.indexOf(b));
}
function topPlaces(cat){
  const g={};
  S.recent.filter(e=>(e.category||"기타")===cat && e.memo).forEach(e=>{
    const k=memoKey(e.memo); if(!k) return;
    const r=g[k]||(g[k]={n:0,names:{},methods:{},last:""});
    const label=String(e.memo).split("(")[0].trim(); r.n++; r.names[label]=(r.names[label]||0)+1;
    const mth=methodOf(e); r.methods[mth]=(r.methods[mth]||0)+1; if((e.date||"")>r.last) r.last=e.date||"";
  });
  const pick=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0]?.[0];
  return Object.values(g).filter(r=>r.n>=1).sort((a,b)=>b.n-a.n||b.last.localeCompare(a.last)).slice(0,8).map(r=>({name:pick(r.names),method:pick(r.methods),n:r.n}));
}
function renderSug(form){
  const box=form.querySelector("#sugBox"), wrap=form.querySelector("#sugChips"); if(!box||!wrap) return;
  const cat=form.querySelector('[data-chips="category"] .chip[aria-pressed="true"]')?.dataset.val||"식비";
  const list=topPlaces(cat);
  box.hidden=!list.length;
  wrap.innerHTML=list.map(s=>`<button type="button" class="chip sug" data-name="${esc(s.name)}" data-method="${esc(s.method||"")}">${esc(s.name)} <span class="muted">${s.n}</span></button>`).join("");
  wrap.onclick=e=>{ const b=e.target.closest(".sug"); if(!b) return;
    const memo=form.querySelector("#f-expense-memo"); if(memo) memo.value=b.dataset.name;
    if(b.dataset.method){ form.querySelectorAll('[data-chips="method"] .chip').forEach(x=>x.setAttribute("aria-pressed",x.dataset.val===b.dataset.method)); }
    wrap.querySelectorAll(".sug").forEach(x=>x.setAttribute("aria-pressed",x===b));
    const amt=form.querySelector("#f-expense-amount"); if(amt && !amt.value) amt.focus();
  };
}

// 시트 닫기: 아래로 미끄러지며 사라짐 (모션 줄이기 설정이면 즉시)
let closeTimer=null;
function closeSheet(){
  const host=document.getElementById("sheetHost"), scrim=host.querySelector(".scrim");
  if(!scrim || scrim.classList.contains("closing")) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ host.innerHTML=""; return; }
  document.activeElement?.blur?.();
  const sh=scrim.querySelector(".sheet"); if(sh){ sh.style.animation="none"; void sh.offsetHeight; }
  scrim.classList.add("closing");
  clearTimeout(closeTimer);
  closeTimer=setTimeout(()=>{ if(host.contains(scrim)) host.innerHTML=""; }, 270);
}
// 시트를 아래로 끌어서 닫기 (맨 위까지 스크롤된 상태에서 아래로 쓸면 따라 내려옴)
function enableSwipe(sheet){
  if(sheet.dataset.swipe) return; sheet.dataset.swipe="1";
  const g=document.createElement("div"); g.className="grab"; g.setAttribute("aria-hidden","true"); sheet.prepend(g);
  const scrim=sheet.parentElement;
  let y0=0,x0=0,t0=0,dy=0,drag=false,decided=false,lastY=0,lastT=0,vel=0;
  sheet.addEventListener("touchstart",e=>{
    if(e.touches.length!==1) return;
    const p=e.touches[0]; y0=lastY=p.clientY; x0=p.clientX; t0=lastT=performance.now(); dy=0; vel=0; drag=false; decided=false;
  },{passive:true});
  sheet.addEventListener("touchmove",e=>{
    const p=e.touches[0], d=p.clientY-y0, dx=p.clientX-x0;
    if(!decided){
      if(Math.abs(d)<6 && Math.abs(dx)<6) return;
      decided=true;
      // 내부 스크롤이 맨 위이고, 아래 방향 세로 제스처일 때만 시트를 끈다
      const inScroller=e.target.closest?.("textarea");
      drag = d>0 && Math.abs(d)>Math.abs(dx) && sheet.scrollTop<=0 && !inScroller;
      if(drag){ sheet.style.animation="none"; sheet.style.transition="none"; scrim.style.transition="none"; }
    }
    if(!drag) return;
    e.preventDefault();
    const now=performance.now(); vel=(p.clientY-lastY)/Math.max(1,now-lastT); lastY=p.clientY; lastT=now;
    dy=Math.max(0,d);
    sheet.style.transform=`translateY(${dy}px)`;
    scrim.style.background=`rgba(0,0,0,${.4*Math.max(0,1-dy/(sheet.offsetHeight||1))})`;
  },{passive:false});
  const end=()=>{
    if(!drag) return; drag=false;
    const h=sheet.offsetHeight||1;
    if(dy>Math.min(140,h*.3) || vel>.6){
      // 손을 뗀 위치에서 이어서 내려감
      scrim.style.transition="background .22s ease"; scrim.style.background="rgba(0,0,0,0)";
      sheet.style.transition="transform .22s cubic-bezier(.3,.7,.4,1)"; sheet.style.transform="translateY(100%)";
      clearTimeout(closeTimer); const host=document.getElementById("sheetHost");
      closeTimer=setTimeout(()=>{ if(host.contains(scrim)) host.innerHTML=""; },230);
      scrim.classList.add("closing-swipe");
    }else{
      sheet.style.transition="transform .28s cubic-bezier(.22,1,.36,1)"; sheet.style.transform="";
      scrim.style.transition="background .28s ease"; scrim.style.background="";
    }
  };
  sheet.addEventListener("touchend",end); sheet.addEventListener("touchcancel",end);
}
new MutationObserver(()=>{
  const sh=document.querySelector("#sheetHost .sheet"); if(sh){ clearTimeout(closeTimer); enableSwipe(sh); }
}).observe(document.getElementById("sheetHost"),{childList:true});

async function guard(fn, okMsg){
  if(!S.db){ toast("저장소에 연결되지 않았어요. 다시 로그인해 주세요."); return false; }
  try{ await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    if(e&&e.code==="unavailable"){ try{ await new Promise(r=>setTimeout(r,600+Math.random()*600)); await fn(); if(okMsg) toast(okMsg); return true; }catch(e2){ e=e2; } }
    if(e&&e.code==="invalid_argument"){ S.canWrite=false; render(); toast("이 계정은 보기만 할 수 있어요."); }
    else if(e&&e.code==="quota_exceeded") toast("저장 공간이 가득 찼어요. 오래된 기록을 지워주세요.");
    else toast("저장하지 못했어요. 잠시 후 다시 시도해주세요.");
    console.error(e); return false;
  }
}

const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth:{ persistSession:true, autoRefreshToken:true, storageKey:"ledger.auth" } });

const SupaDB=(()=>{
  const cache={}, loading={}, subs=new Set();
  const clone=d=>d==null?d:JSON.parse(JSON.stringify(d));
  const notify=()=>{ clearTimeout(notify.t); notify.t=setTimeout(()=>subs.forEach(f=>{ try{f();}catch(e){console.error(e);} }),0); };
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const fail=(error)=>{ const e=new Error(error.message||"저장 실패"); e.code=/JWT|auth/i.test(error.message||"")?"revoked":"unavailable"; throw e; };
  async function loadCol(col, force){
    if(cache[col] && !force) return;
    if(loading[col] && !force) return loading[col];
    loading[col]=(async()=>{
      const m=new Map(); let from=0;
      for(;;){ const {data,error}=await sb.from("docs").select("id,data").eq("collection",col).range(from,from+999);
        if(error) fail(error); data.forEach(r=>m.set(r.id,r.data)); if(data.length<1000) break; from+=1000; }
      cache[col]=m; delete loading[col]; notify();
    })();
    return loading[col];
  }
  const dsnap=(id,d)=>({id,exists:d!==undefined,data:()=>clone(d),metadata:{fromCache:false,hasPendingWrites:false}});
  const cmp={ "==":(a,b)=>a===b, "!=":(a,b)=>a!==b, ">=":(a,b)=>a>=b, "<=":(a,b)=>a<=b, ">":(a,b)=>a>b, "<":(a,b)=>a<b };
  function docRef(col,id){
    const put=async(d)=>{ await loadCol(col); const prev=cache[col].get(id); cache[col].set(id,clone(d)); notify();
      const {error}=await sb.from("docs").upsert({collection:col,id,data:d},{onConflict:"owner,collection,id"});
      if(error){ if(prev===undefined) cache[col].delete(id); else cache[col].set(id,prev); notify(); fail(error); } };
    return { id, path:col+"/"+id,
      async get(){ await loadCol(col); return dsnap(id,cache[col].get(id)); },
      set:(d)=>put(clone(d)),
      async update(d){ await loadCol(col); const cur=cache[col].get(id); if(cur===undefined){ const e=new Error("없는 기록"); e.code="not_found"; throw e; } return put({...cur,...clone(d)}); },
      async delete(){ await loadCol(col); const prev=cache[col].get(id); cache[col].delete(id); notify();
        const {error}=await sb.from("docs").delete().eq("collection",col).eq("id",id);
        if(error){ if(prev!==undefined) cache[col].set(id,prev); notify(); fail(error); } },
      onSnapshot(next,err){ const f=()=>{ if(cache[col]) next(dsnap(id,cache[col].get(id))); }; subs.add(f); loadCol(col).then(f,err||console.error); return ()=>subs.delete(f); } };
  }
  function query(col,filters){
    const run=()=>{ const docs=[...cache[col].entries()].filter(([,d])=>filters.every(([f,o,v])=>(cmp[o]||cmp["=="])(d[f],v))).sort((a,b)=>a[0].localeCompare(b[0])).map(([id,d])=>dsnap(id,d));
      return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}; };
    return { path:col,
      where(f,o,v){ return query(col,[...filters,[f,o,v]]); }, orderBy(){ return this; }, limit(){ return this; },
      async get(){ await loadCol(col); return run(); },
      onSnapshot(next,err){ const f=()=>{ if(cache[col]) next(run()); }; subs.add(f); loadCol(col).then(f,err||console.error); return ()=>subs.delete(f); },
      doc(id){ return docRef(col, id||uid()); },
      async add(d){ const r=docRef(col,uid()); await r.set(d); return r; } };
  }
  // 다른 곳(대화·단축어·밤 작업)에서 바뀐 내용 실시간 반영
  function live(){
    sb.channel("docs-live").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
      const row=p.eventType==="DELETE"? p.old : p.new; const col=row&&row.collection; if(!col||!cache[col]) return;
      if(p.eventType==="DELETE") cache[col].delete(row.id); else cache[col].set(row.id,row.data);
      notify();
    }).subscribe();
  }
  // 앱을 다시 열 때(백그라운드 복귀) 전체 새로고침
  async function refresh(){ await Promise.all(Object.keys(cache).map(c=>loadCol(c,true).catch(console.error))); }
  return { collection:(c)=>query(c,[]), doc:(p)=>{ const [c,id]=p.split("/"); return docRef(c,id); }, live, refresh };
})();

async function boot(){
  render();
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ return showLogin(); }
  start();
}
function showLogin(){
  const box=document.getElementById("login"); box.hidden=false;
  const f=document.getElementById("loginForm");
  f.onsubmit=async e=>{ e.preventDefault(); const err=document.getElementById("lgErr"); err.textContent="";
    const btn=f.querySelector("button"); btn.disabled=true; btn.textContent="확인 중…";
    const {error}=await sb.auth.signInWithPassword({email:document.getElementById("lgEmail").value.trim(), password:document.getElementById("lgPw").value});
    btn.disabled=false; btn.textContent="로그인";
    if(error){ err.textContent="이메일이나 비밀번호가 맞지 않아요."; return; }
    box.hidden=true; start(); };
}
let started=false;
function start(){
  if(started) return; started=true;
  const db=SupaDB; S.db=db; S.canWrite=true;
  const timer=setTimeout(()=>{ if(!S.loaded) status("기록을 불러오는 중이에요. 네트워크를 확인해주세요.","warn"); },8000);
  const live=(fn)=>s=>{ fn(s); if(!S.loaded){ S.loaded=true; clearTimeout(timer); status(""); } render(); };
  db.collection("income").onSnapshot(live(s=>S.income=docs(s)), onErr);
  db.collection("fixed").onSnapshot(live(s=>S.fixed=docs(s)), onErr);
  db.collection("invest").onSnapshot(live(s=>S.invest=docs(s)), onErr);
  db.collection("todos").onSnapshot(live(s=>S.todos=docs(s)), onErr);
  db.collection("investSnap").onSnapshot(live(s=>S.snaps=docs(s)), onErr);
  db.collection("debts").onSnapshot(live(s=>S.debts=docs(s)), onErr);
  db.collection("plans").onSnapshot(live(s=>S.plans=docs(s)), onErr);
  db.collection("expenses").where("month",">=",shiftMonth(ym(new Date()),-2)).onSnapshot(s=>{ S.recent=docs(s); }, onErr);
  db.collection("dcLog").onSnapshot(live(s=>S.dc=docs(s)), onErr);
  db.doc("settings/main").onSnapshot(live(s=>S.settings=s.exists? s.data() : {}), onErr);
  subExpenses();
  db.live();
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") db.refresh(); });
  sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT"){ location.reload(); } });
}
boot();
})();
